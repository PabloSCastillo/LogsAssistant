spring.application.name=assistant

spring.docker.compose.enabled=false
#spring.profiles.active=dev

# ==========================================
# BASE DE DATOS POSTGRESQL & JPA
# ==========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8081

# ==========================================
# SPRING AI - GOOGLE GENAI (GEMINI)
# ==========================================
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

# ==========================================
# ELASTICSEARCH
# ==========================================
spring.elasticsearch.uris=http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}